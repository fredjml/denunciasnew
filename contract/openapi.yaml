openapi: 3.1.0

info:
  title: Canal de Denúncias MPT — Contrato do MVP
  version: 0.1.0
  description: |
    Contrato entre o frontend Angular (app/) e o backend (mock-api/ no MVP,
    backend real futuro). Fonte de verdade compartilhada.

    Regras:
    - Mudanças exigem PR + review (R-DN-06).
    - O backend real futuro pode ACRESCENTAR campos, mas nunca REMOVER os declarados.
    - `app/src/app/api/generated.ts` é gerado por openapi-typescript.

    Referências:
    - docs/preparacao-implementacao/08-TDD.delta-denunciasnew.md
    - docs/preparacao-implementacao/06-REQUIREMENTS.delta-denunciasnew.md
    - docs/Documento externo-outros 010970.2026.pdf (fonte primária)
  contact:
    name: denunciasnew MVP
    url: https://github.com/fredjml/denunciasnew

servers:
  - url: http://localhost:3001
    description: Mock local (mock-api)
  - url: https://denunciasnew.vercel.app/api
    description: Preview no Vercel
  - url: https://denuncias-api.mpt.mp.br
    description: Produção MPT (futuro, backend real)

tags:
  - name: denuncias
    description: Submissão e consulta de denúncias
  - name: localidades
    description: Municípios e UF (proxy IBGE + fallback)
  - name: operacao
    description: Health check e observabilidade

paths:
  /api/denuncias:
    post:
      operationId: submeterDenuncia
      tags: [denuncias]
      summary: Submete uma denúncia com anexos opcionais
      description: |
        Envelope multipart contendo o objeto `Complaint` como JSON no campo
        `denuncia` e 0..N anexos como `arquivo_1..N` (documentos) e opcionalmente
        `arquivo_audio` (gravação).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [denuncia]
              properties:
                denuncia:
                  type: string
                  description: JSON serializado do objeto Complaint
                arquivo_1:
                  type: string
                  format: binary
                arquivo_2:
                  type: string
                  format: binary
                arquivo_3:
                  type: string
                  format: binary
                arquivo_audio:
                  type: string
                  format: binary
      responses:
        '201':
          description: Denúncia aceita
          headers:
            X-Request-ID:
              schema: { type: string }
              description: Identificador de correlação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DenunciaAceita'
        '400':
          description: Validação falhou
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroApi' }
        '413':
          description: Tamanho excedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroApi' }
        '422':
          description: Antimalware ou MIME rejeitado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroApi' }
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroApi' }

  /api/municipios:
    get:
      operationId: listarMunicipios
      tags: [localidades]
      summary: Lista municípios por UF
      parameters:
        - in: query
          name: uf
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 2
            pattern: '^[A-Z]{2}$'
      responses:
        '200':
          description: Lista de municípios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Municipio' }
        '400':
          description: UF inválida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroApi' }

  /health:
    get:
      operationId: health
      tags: [operacao]
      summary: Health check
      responses:
        '200':
          description: Serviço saudável
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
                  timestamp: { type: string, format: date-time }
                  version: { type: string }

components:
  schemas:
    Complaint:
      type: object
      required:
        - origem
        - irregularidades
        - tipo_identificacao
        - uf
        - municipio
      properties:
        origem:
          type: string
          enum: [WEB, WHATSAPP_BOT]
          description: Canal de entrada da denúncia
        irregularidades:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Irregularidade' }
        relato_texto:
          type: string
          maxLength: 20000
        relato_audio_transcricao:
          type: string
          maxLength: 20000
        relato_audio_transcricao_status:
          type: string
          enum: [NAO_APLICAVEL, PENDENTE, CONCLUIDA, FALHA, EDITADA_MANUALMENTE]
        numero_prejudicados:
          type: string
          enum: [UM, DOIS_A_CINCO, SEIS_A_VINTE, VINTE_UM_A_CEM, MAIS_DE_CEM]
        modalidade_trabalho:
          type: string
          enum: [PRESENCIAL, REMOTO, HIBRIDO, INFORMAL, TERCEIRIZADO, OUTRA]
        grupos_vulneraveis:
          type: array
          items:
            type: string
            enum: [IDOSO, CRIANCA, PESSOA_COM_DEFICIENCIA, OUTRO]
        tipo_identificacao:
          type: string
          enum: [ANONIMO, IDENTIFICADO]
        nome_completo:
          type: string
          maxLength: 200
          description: Omitido quando tipo_identificacao=ANONIMO
        email:
          type: string
          format: email
          description: Omitido quando tipo_identificacao=ANONIMO
        telefone:
          type: string
          maxLength: 20
          description: Omitido quando tipo_identificacao=ANONIMO
        uf:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^[A-Z]{2}$'
        municipio:
          type: string
          maxLength: 100
        municipio_ibge:
          type: string
          description: Código IBGE do município
        nome_empresa:
          type: string
          maxLength: 200
        endereco_empresa:
          type: string
          maxLength: 500
        testemunhas:
          type: array
          items: { $ref: '#/components/schemas/Testemunha' }
        consentimento_lgpd:
          type: boolean
          description: Obrigatório true para submeter

    Irregularidade:
      type: object
      required: [codigo]
      properties:
        codigo:
          type: string
          description: Ex. FALTA_EPI, ASSEDIO, ATRASO_SALARIO
        rotulo:
          type: string
        icone:
          type: string
        categoria:
          type: string

    Testemunha:
      type: object
      required: [tem_testemunhas]
      properties:
        tem_testemunhas:
          type: boolean
        nome_referencial:
          type: string
          maxLength: 200
        contato_opcional:
          type: string
          maxLength: 200

    Municipio:
      type: object
      required: [codigo_ibge, nome, uf]
      properties:
        codigo_ibge:
          type: string
        nome:
          type: string
        uf:
          type: string
          minLength: 2
          maxLength: 2

    DenunciaAceita:
      type: object
      required: [protocolo, timestamp]
      properties:
        protocolo:
          type: string
          pattern: '^SYN-[A-Z0-9]{8}$'
          description: Prefixo SYN- no MVP (mock). Formato real do MPT em DEC-DN-19.
        timestamp:
          type: string
          format: date-time
        classificacao:
          $ref: '#/components/schemas/Classificacao'

    Classificacao:
      type: object
      description: |
        Classificação automática do relato. Prioridade é sempre setada
        server-side (R-DN-02). Alertas URGENTE exigem revisão humana (R-DN-03).
      properties:
        categoria:
          type: string
        subcategoria:
          type: string
        prioridade:
          type: string
          enum: [BAIXA, MEDIA, ALTA, URGENTE]
        metodo:
          type: string
          enum: [REGRA_DETERMINISTICA, MODELO_ML]
        versao_classificador:
          type: string
        revisada_por_humano:
          type: boolean

    ErroApi:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo:
          type: string
          description: Código de erro estável (para i18n do cliente)
        mensagem:
          type: string
        detalhes:
          type: object
          additionalProperties: true
