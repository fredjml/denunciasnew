<div class="step-content">
  <h1 class="mb-md">Denuncie ao MPT</h1>
  <p class="text-secondary-mpt">
    Conte do seu jeito a irregularidade que você viu ou que aconteceu no seu ambiente de trabalho
  </p>

  <!-- Vídeo institucional -->
  <div class="video-placeholder" id="video-institucional">
    <div class="play-btn">
      <i class="bi bi-play-fill"></i>
    </div>
    <span class="video-label">Vídeo Explicativo (45s)</span>
  </div>

  <!-- Ações -->
  <h3 class="section-subtitle-secondary mb-md">Sobre o que você deseja falar?</h3>

  <div class="card-mpt card-action card-action-primary mb-md" id="btn-denunciar" (click)="iniciarDenuncia()">
    <div class="card-icon card-icon-primary">
      <i class="bi bi-megaphone-fill"></i>
    </div>
    <div class="card-label-group">
      <span class="card-label">Denunciar</span>
    </div>
    <i class="bi bi-chevron-right card-chevron"></i>
  </div>

  <div class="card-mpt card-action mb-md" id="btn-orgao-publico">
    <div class="card-icon">
      <i class="bi bi-building"></i>
    </div>
    <span class="card-label">Faz parte de um órgão público e quer denunciar</span>
  </div>

  <div class="card-mpt card-action mb-md" id="btn-ouvidoria">
    <div class="card-icon">
      <i class="bi bi-chat-dots"></i>
    </div>
    <span class="card-label">Tem dúvida? Fale com a Ouvidoria</span>
  </div>
</div>
