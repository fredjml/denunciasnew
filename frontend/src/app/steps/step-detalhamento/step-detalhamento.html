<main class="page-shell" id="conteudo-principal">
  <header>
    <p class="step-label">Detalhamento</p>
    <h1>Mais alguns detalhes</h1>
    <p>Essas perguntas são opcionais e ajudam a entender melhor o caso. Se não souber, pode deixar em branco.</p>
  </header>

  <div class="field">
    <label for="numero-trabalhadores">Quantas pessoas trabalhadoras foram afetadas, aproximadamente?</label>
    <select
      id="numero-trabalhadores"
      data-testid="numero-trabalhadores"
      [ngModel]="state.numeroTrabalhadores()"
      (ngModelChange)="setNumero($event)"
    >
      <option value="">Prefiro não informar</option>
      <option value="1">1</option>
      <option value="2-5">2 a 5</option>
      <option value="6-20">6 a 20</option>
      <option value="21-100">21 a 100</option>
      <option value="100+">Mais de 100</option>
    </select>
  </div>

  <div class="field">
    <label for="modalidade-trabalho">Como era a modalidade de trabalho?</label>
    <select
      id="modalidade-trabalho"
      data-testid="modalidade-trabalho"
      [ngModel]="state.modalidadeTrabalho()"
      (ngModelChange)="setModalidade($event)"
    >
      <option value="">Prefiro não informar</option>
      <option value="presencial">Presencial</option>
      <option value="remoto">Remoto</option>
      <option value="hibrido">Híbrido</option>
      <option value="informal">Informal</option>
      <option value="terceirizado">Terceirizado</option>
      <option value="outra">Outra</option>
    </select>
  </div>

  <fieldset class="checklist">
    <legend>Algum desses grupos foi afetado? (opcional)</legend>
    @for (grupo of gruposVulneraveis; track grupo.codigo) {
      <label>
        <input
          type="checkbox"
          name="grupo-vulneravel"
          [checked]="state.gruposVulneraveis().includes(grupo.codigo)"
          (change)="toggleGrupo(grupo.codigo)"
        />
        <span>{{ grupo.rotulo }}</span>
      </label>
    }
  </fieldset>

  <button class="primary-action" type="button" data-testid="avancar-detalhamento" (click)="goNext()">
    Avançar
  </button>
</main>
