<section class="video-card" aria-labelledby="video-title">
  <h2 id="video-title" class="visually-hidden">Vídeo Explicativo</h2>

  <div class="video-frame" [class.video-frame--started]="started()">
    <video
      #videoEl
      [attr.controls]="started() ? true : null"
      preload="metadata"
      aria-describedby="video-description"
      aria-label="Vídeo Explicativo: conheça o papel do MPT"
    >
      <track
        default
        kind="captions"
        label="Português"
        srclang="pt-BR"
        src="/media/video-institucional-placeholder.vtt"
      />
      Seu navegador não oferece suporte ao elemento de vídeo.
    </video>

    @if (!started()) {
      <button type="button" class="video-overlay" data-testid="video-play" (click)="play()">
        <span class="video-overlay__play">
          <app-icon name="play" [size]="28" />
        </span>
        <span class="video-overlay__caption">Vídeo Explicativo (45s)</span>
      </button>
    }
  </div>

  <details id="video-description" class="transcript" data-testid="transcricao-video">
    <summary>Ver transcrição do vídeo</summary>
    <p>
      Conteúdo institucional pendente de aprovação. Este texto é um placeholder sintético e não
      substitui a versão oficial do MPT.
    </p>
  </details>
</section>
